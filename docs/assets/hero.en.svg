<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" style="max-width:100%;height:auto" role="img" aria-label="Memoir: one Markdown file per category, three layers deep, plus a dedicated page">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 27px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 13px; fill: #656d76; }
    .cardtitle { font-size: 11px; font-weight: 600; fill: #8c959f; letter-spacing: .08em; }
    .l1 { font-size: 15px; font-weight: 700; fill: #8250df; }
    .l2 { font-size: 13px; font-weight: 700; fill: #0969da; }
    .l3 { font-size: 12px; fill: #1f2328; }
    .meta { font-size: 10.5px; fill: #a0a8b0; }
    .cat { font-size: 12px; font-weight: 600; fill: #1f2328; }
    .catdim { font-size: 12px; fill: #57606a; }
    .cnt { font-size: 10.5px; fill: #8c959f; }
    .note { font-size: 11px; fill: #656d76; }
    .badgetext { font-size: 11px; font-weight: 600; fill: #0969da; }
  </style>
  <rect width="900" height="452" fill="#ffffff"/>
  <text class="title" x="34" y="46">Memoir</text>
  <text class="sub" x="34" y="68">Cross-session memory, kept as a short Markdown living document — rewritten, never appended to.</text>
  <rect x="34" y="94" width="404" height="322" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="cardtitle" x="56" y="122">MEMORY DIR · ONE .MD PER CATEGORY</text>
  <text class="l1 mono" x="56" y="154"># Things in flight</text>
  <text class="meta mono" x="56" y="174">&lt;!-- one section per project · hand-editable --&gt;</text>
  <text class="l2 mono" x="56" y="204">## Memoir</text>
  <text class="l3 mono" x="56" y="226">- Cross-session memory as</text>
  <text class="l3 mono" x="56" y="244">  a short Markdown living doc</text>
  <text class="l3 mono" x="56" y="266">- Three layers: category /</text>
  <text class="l3 mono" x="56" y="284">  section / entry, never more</text>
  <text class="l2 mono" x="56" y="314">## Net: semantic topology</text>
  <text class="l3 mono" x="56" y="336">- A network whose topology</text>
  <text class="l3 mono" x="56" y="354">  carries meaning, grown itself</text>
  <text class="meta mono" x="56" y="378">&lt;!-- memoir id=a1b2c3d4 | imp=4 --&gt;</text>
  <text class="note" x="56" y="400">Plain text · no database · no cache</text>
  <rect x="462" y="94" width="404" height="322" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="cardtitle" x="484" y="122">GUI PAGE · SIDEBAR ENTRY</text>
  <rect x="482" y="138" width="126" height="256" rx="8" fill="#f6f8fa" stroke="#e4e8ec" stroke-width="1"/>
  <rect x="492" y="150" width="106" height="24" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text class="cat" x="502" y="167">All</text>
  <text class="cnt" x="578" y="167">38</text>
