  <text class="cnt" x="578" y="300">2</text>
  <line x1="492" y1="324" x2="598" y2="324" stroke="#e4e8ec" stroke-width="1"/>
  <text class="catdim" x="502" y="346">⚙ Settings</text>
  <text class="cnt" x="502" y="366">writes</text>
  <rect x="624" y="138" width="222" height="66" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="158" font-size="11.5">Memoir</text>
  <text class="l3" x="638" y="176" font-size="11.5">Cross-session memory as</text>
  <text class="l3" x="638" y="193" font-size="11.5">a short Markdown living doc</text>
  <rect x="624" y="214" width="222" height="52" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="234" font-size="11.5">Memoir</text>
  <text class="l3" x="638" y="252" font-size="11.5">Only the long-term layer</text>
  <rect x="624" y="276" width="222" height="66" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="296" font-size="11.5">Net: semantic topology</text>
  <text class="l3" x="638" y="314" font-size="11.5">Topology carries meaning;</text>
  <text class="l3" x="638" y="331" font-size="11.5">the network grows itself</text>
  <rect x="624" y="354" width="120" height="26" rx="13" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text class="badgetext" x="640" y="371">← Back to chat</text>
  <text class="cnt" x="756" y="371">⚙ Settings</text>
