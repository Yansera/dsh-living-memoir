  <rect x="624" y="138" width="222" height="58" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="160" font-size="11.5">记忆册</text>
  <text class="l3" x="638" y="180" font-size="11.5">把跨会话记忆整理成分类简短的 md 活文档</text>

  <rect x="624" y="206" width="222" height="58" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="228" font-size="11.5">记忆册</text>
  <text class="l3" x="638" y="248" font-size="11.5">只承担长期宏观那一层</text>

  <rect x="624" y="274" width="222" height="58" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
  <text class="l2 mono" x="638" y="296" font-size="11.5">修仙：进化网络</text>
